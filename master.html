<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091029">
  <meta name="robots" content="noindex,nofollow">
  <title>Master order screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="site-header">
    <img class="brand-logo" src="assets/logo.png" alt="Mechatronic Solutions">
  </header>

  <main>
    <span class="station-eyebrow">Master</span>
    <h1>Place an order</h1>
    <p class="subtitle">Order any drink for any station. Time restrictions do not apply on this screen.</p>

    <form class="master-form" id="master-form">
      <label class="field">
        <span class="field-label">Station</span>
        <select class="field-select" id="station-select" required></select>
      </label>

      <label class="field">
        <span class="field-label">Drink</span>
        <select class="field-select" id="drink-select" required></select>
      </label>

      <button class="btn btn-primary btn-block" type="submit" id="order-btn">Place order</button>
    </form>

    <div class="status" id="status" style="display:none"></div>
  </main>

  <footer class="site-footer">
    Powered by Mechatronic Solutions
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/drink-settings.js"></script>
  <script src="assets/master.js"></script>
</body>
</html>
